<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福州“消失的老码头”时空故事地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:"Microsoft Yahei",sans-serif;background:#f5f0e6;}
        .header{height:65px;background:#6d4c41;color:#fff;line-height:65px;text-align:center;font-size:24px;font-weight:bold;}
        .container{display:flex;height:calc(100vh - 65px);}
        .story-panel{width:30%;background:#fffaf0;padding:28px;overflow-y:auto;border-right:2px solid #d7ccc8;}
        .story-title{font-size:20px;color:#5d4037;margin-bottom:18px;font-weight:bold;border-left:4px solid #8d6e63;padding-left:10px;}
        .story-text{font-size:16px;color:#3e2723;line-height:1.9;margin-bottom:22px;}
        .story-img{width:100%;border-radius:8px;margin-bottom:22px;box-shadow:0 3px 6px rgba(0,0,0,0.1);}
        #map{width:70%;height:100%;}
        .btn-group{display:flex;justify-content:space-between;margin-top:25px;gap:10px;}
        .btn{flex:1;padding:12px 0;border:none;border-radius:6px;background:#8d6e63;color:#fff;cursor:pointer;font-size:15px;font-weight:bold;}
        .btn:hover{background:#5d4037;}
    </style>
</head>
<body>
    <div class="header">福州“消失的老码头”时空故事地图</div>
    <div class="container">
        <div class="story-panel">
            <h2 class="story-title" id="storyTitle">开端：清末码头兴起（1880-1911）</h2>
            <p class="story-text" id="storyText">清末福州开埠，闽江沿岸依托水运兴起首批老码头，成为货物集散、百姓出行的核心枢纽。</p>
            <img src="https://picsum.photos/id/1048/600/400" class="story-img" id="storyImg">
            <div class="btn-group">
                <button class="btn" onclick="prevChapter()">上一章</button>
                <button class="btn" onclick="nextChapter()">下一章</button>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        const map = L.map('map').setView([26.075, 119.305], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const chapters = [
            {
                title: "开端：清末码头兴起（1880-1911）",
                text: "清末福州开埠，闽江沿岸兴起首批老码头，地图俯瞰全流域码头分布格局。",
                img: "https://picsum.photos/id/1048/600/400",
                center: [26.075, 119.305], zoom: 13,
                layerColor: "#8d6e63"
            },
            {
                title: "发展：民国码头繁盛（1912-1949）",
                text: "民国时期码头规模扩大，商贸鼎盛，地图漫游至台江核心码头群。",
                img: "https://picsum.photos/id/1082/600/400",
                center: [26.068, 119.312], zoom: 15,
                layerColor: "#ffb74d"
            },
            {
                title: "高潮：建国后码头转型（1950-2000）",
                text: "陆路交通崛起，老码头逐渐荒废，地图放大至废弃码头点位。",
                img: "https://picsum.photos/id/119/600/400",
                center: [26.065, 119.315], zoom: 16,
                layerColor: "#757575"
            },
            {
                title: "结尾：新时代码头新生（2001-2025）",
                text: "老码头改造为滨江文化公园，以新形式回归城市水岸。",
                img: "https://picsum.photos/id/1036/600/400",
                center: [26.075, 119.305], zoom: 13,
                layerColor: "#66bb6a"
            }
        ];

        let currentLayer = null;
        let currentIndex = 0;

        function updateChapter(){
            const c = chapters[currentIndex];
            document.getElementById("storyTitle").innerText = c.title;
            document.getElementById("storyText").innerText = c.text;
            document.getElementById("storyImg").src = c.img;
            map.flyTo(c.center, c.zoom, {duration:2});
            
            if(currentLayer) map.removeLayer(currentLayer);
            currentLayer = L.layerGroup();
            const points = [[26.066,119.310],[26.069,119.313],[26.072,119.308],[26.064,119.316],[26.070,119.305]];
            points.forEach(p=>L.circleMarker(p,{color:c.layerColor,radius:7}).addTo(currentLayer));
            currentLayer.addTo(map);
        }

        function nextChapter(){currentIndex=(currentIndex+1)%chapters.length;updateChapter();}
        function prevChapter(){currentIndex=(currentIndex-1+chapters.length)%chapters.length;updateChapter();}
        updateChapter();
    </script>
</body>
</html>
